name: App E2E (iOS)

# The native iOS app on a simulator, driven by the Maestro flows in frontend/maestro. It signs in with the
# review account against production and stops before anything that calls a paid AI provider (no answer is
# graded by a model; the test build transcribes its recording on the device, ADR-0014). It runs nightly and on
# demand on the owner's own Mac (self-hosted runner with the label "turktalk-mac").
#
# The repository is public. A self-hosted runner executes whatever a job gives it, so no workflow with a
# pull_request trigger may ever use this runner: keep the triggers below to schedule and workflow_dispatch,
# which only run code already on the default branch.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-e2e-ios
  cancel-in-progress: true

jobs:
  ios:
    name: App E2E (iOS simulator)
    # Only jobs on the default branch reach the owner's Mac (scheduled runs always use it; a manual run
    # from another branch is refused).
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, turktalk-mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: extractions/setup-just@v3
      # The Mac's selected Xcode is used as is (Capacitor 8 needs Xcode 26 or later).
      - run: xcodebuild -version
      - run: just frontend-install
      # Maestro is installed on the Mac once (brew install mobile-dev-inc/tap/maestro).
      - name: Check Maestro
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          PATH="/opt/homebrew/bin:$PATH" maestro --version
      - name: Build the simulator app
        run: scripts/build-ios.sh sim
      # The simulator app is the test build: it records a bundled phrase instead of the microphone (runners
      # have no audio input) and answers the transcription on the device (ADR-0014).
      # Do not upload Maestro's debug output as an artifact: it holds the typed text (masked locally by
      # scripts/test-app.sh, but keep it off GitHub anyway).
      - name: Run the flows
        run: scripts/test-app.sh ios
        env:
          MAESTRO_EXCLUDE_TAGS: wip
          MAESTRO_REVIEW_EMAIL: ${{ secrets.REVIEW_LOGIN_EMAIL }}
          MAESTRO_REVIEW_PASSWORD: ${{ secrets.REVIEW_LOGIN_PASSWORD }}
